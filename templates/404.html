{% extends "base.html" %}

{% block title %}404 - Page Not Found | {{ portal_title }}{% endblock %}

{% block content %}
<div style="text-align: center; padding: 4rem 1rem;">
  <div style="font-size: 4rem; margin-bottom: 1rem;">🔍</div>
  <h2 style="font-size: 2rem; color: var(--primary); margin-bottom: 0.5rem;">404 - Page Not Found</h2>
  <p style="color: var(--text-muted); max-width: 480px; margin: 0 auto 1.5rem;">The page or complaint record you are looking for does not exist or may have been moved.</p>
  <a href="{{ url_for('index') }}" class="btn btn-primary">Return to Home</a>
</div>
{% endblock %}
